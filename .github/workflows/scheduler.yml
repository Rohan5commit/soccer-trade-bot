name: Match Scheduler

on:
  schedule:
    - cron: '30 4 * * *'  # 10:00 IST daily (04:30 UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q cloudscraper requests cryptography

      - name: Decode Kalshi private key
        env:
          KALSHI_PRIVATE_KEY_B64: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
        run: |
          DECODED=$(echo "$KALSHI_PRIVATE_KEY_B64" | base64 -d)
          {
            echo "KALSHI_PRIVATE_KEY<<EOF"
            echo "$DECODED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Discover matches + pick best
        id: discover
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
        run: |
          python scripts/match_scheduler.py \
            --within-hours 24 \
            --output data/schedule.json \
            --best-output data/best_match.json
          MATCH_COUNT=$(python -c "import json; d=json.load(open('data/schedule.json')); print(d['match_count'])")
          echo "match_count=$MATCH_COUNT" >> $GITHUB_OUTPUT

          # Extract best match fields
          if [ -f data/best_match.json ]; then
            HOME=$(python -c "import json; print(json.load(open('data/best_match.json'))['home'])")
            AWAY=$(python -c "import json; print(json.load(open('data/best_match.json'))['away'])")
            KICKOFF=$(python -c "import json; print(json.load(open('data/best_match.json'))['kickoff_ist'])")
            TICKER=$(python -c "import json; print(json.load(open('data/best_match.json'))['event_ticker'])")
            SCORE=$(python -c "import json; print(json.load(open('data/best_match.json'))['score'])")
            echo "best_home=$HOME" >> $GITHUB_OUTPUT
            echo "best_away=$AWAY" >> $GITHUB_OUTPUT
            echo "best_kickoff=$KICKOFF" >> $GITHUB_OUTPUT
            echo "best_ticker=$TICKER" >> $GITHUB_OUTPUT
            echo "best_score=$SCORE" >> $GITHUB_OUTPUT
            echo "Found best match: $HOME vs $AWAY (score=$SCORE, kickoff=$KICKOFF)"
          else
            echo "No match found to trade today"
          fi

      - name: Store schedule as artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-schedule
          path: data/schedule.json
          retention-days: 2

      - name: Store best match as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: best-match
          path: data/best_match.json
          retention-days: 2

      - name: Summary
        if: always()
        run: |
          echo "## Match Scheduler Results" >> $GITHUB_STEP_SUMMARY
          echo "- Total matches found: ${{ steps.discover.outputs.match_count }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.discover.outputs.best_home }}" ]; then
            echo "- **Best match: ${{ steps.discover.outputs.best_home }} vs ${{ steps.discover.outputs.best_away }}**" >> $GITHUB_STEP_SUMMARY
            echo "- Score: ${{ steps.discover.outputs.best_score }}" >> $GITHUB_STEP_SUMMARY
            echo "- Kickoff: ${{ steps.discover.outputs.best_kickoff }}" >> $GITHUB_STEP_SUMMARY
            echo "- Event: ${{ steps.discover.outputs.best_ticker }}" >> $GITHUB_STEP_SUMMARY
            echo "- Bot dispatch: handled by watcher.yml (proximity-based)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No matches found today" >> $GITHUB_STEP_SUMMARY
          fi
