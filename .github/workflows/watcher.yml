name: Match Watcher

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes (BSD has no rate limit)
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Must cover sleep-until-ready: up to ~340 min nap + setup/dispatch.
    # GitHub throttles */10 crons to multi-hour gaps, so we track matches
    # out to 360 min and sleep until they're within 180 min of kickoff.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests cryptography cloudscraper

      - name: Download latest schedule
        uses: dawidd6/action-download-artifact@v6
        with:
          name: match-schedule
          path: data/
          if_no_artifact_found: warn
          workflow: scheduler.yml

      - name: Download scheduler's best-match pick
        uses: dawidd6/action-download-artifact@v6
        with:
          name: best-match
          path: data/
          if_no_artifact_found: warn
          workflow: scheduler.yml

      - name: Decode Kalshi private key
        env:
          KALSHI_PRIVATE_KEY_B64: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
        run: |
          DECODED=$(echo "$KALSHI_PRIVATE_KEY_B64" | base64 -d)
          {
            echo "KALSHI_PRIVATE_KEY<<EOF"
            echo "$DECODED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Check proximity and dispatch bot
        id: check
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -eo pipefail
          # Tee to a file so long sleep-until-ready runs still leave full logs
          python scripts/watch_proximity.py 2>&1 | tee /tmp/watcher_out.txt
          if ! grep -q "^dispatched=" /tmp/watcher_out.txt; then
            echo "Watcher failed to output dispatched= — treating as error" >&2
            exit 1
          fi
          DISPATCHED=$(grep "^dispatched=" /tmp/watcher_out.txt | cut -d= -f2-)
          echo "dispatched=${DISPATCHED:-none}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "## Watcher Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dispatched: ${{ steps.check.outputs.dispatched || 'none' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
