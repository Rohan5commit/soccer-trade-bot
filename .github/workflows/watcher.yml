name: Match Watcher

on:
  schedule:
    - cron: '15,45 * * * *'  # Every 30 min at :15 and :45
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download latest schedule
        uses: dawidd6/action-download-artifact@v6
        with:
          name: match-schedule
          path: data/
          if_no_artifact_found: warn
          workflow: scheduler.yml

      - name: Download scheduler's best-match pick
        uses: dawidd6/action-download-artifact@v6
        with:
          name: best-match
          path: data/
          if_no_artifact_found: warn
          workflow: scheduler.yml

      - name: Decode Kalshi private key
        env:
          KALSHI_PRIVATE_KEY_B64: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
        run: |
          DECODED=$(echo "$KALSHI_PRIVATE_KEY_B64" | base64 -d)
          {
            echo "KALSHI_PRIVATE_KEY<<EOF"
            echo "$DECODED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Check proximity and dispatch bot
        id: check
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(python scripts/watch_proximity.py 2>&1)
          echo "$OUTPUT"
          DISPATCHED=$(echo "$OUTPUT" | grep "^dispatched=" | cut -d= -f2-)
          echo "dispatched=${DISPATCHED:-none}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "## Watcher Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dispatched: ${{ steps.check.outputs.dispatched || 'none' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
